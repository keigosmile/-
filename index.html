<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>ここは何藩？</title>
<meta name="description" content="現在地や地図上の地点が、幕末（慶応4年1月1日時点）にどの旧国・どの藩の領地だったかを推定表示する試作アプリ">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="bar">
  <h1 class="title"><span class="nw">ここは何藩？</span></h1>
  <nav class="bar-links">
    <a href="credits.html" class="nw">出典・注意</a>
  </nav>
</header>

<div id="map" aria-label="地図"></div>

<button id="locate" class="locate" type="button" aria-label="現在地を調べる">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  <span class="nw">現在地</span>
</button>

<section id="sheet" class="sheet" aria-live="polite">
    <div id="sheet-body">
      <p class="lead">
        <span class="nw">「現在地」ボタン</span>を押すか、<span class="nw">地図をタップ</span>すると、
        その場所が<span class="nw">慶応4年1月1日</span>の<span class="nw">時点で</span>どの<span class="nw">旧国・藩</span>だったかを表示します。
      </p>
      <p id="status" class="status">データを読み込み中…</p>
    </div>
</section>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="vendor/budoux-ja-parser.min.js"></script>
<script src="assets/phrase.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
